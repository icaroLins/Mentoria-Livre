
  services:
    postgres:
      image: postgres:17
      container_name: mentoria-livre-postgres
      restart: unless-stopped
      environment:
        POSTGRES_DB: mentoria_livre
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
      ports:
        - "5433:5432"
      volumes:
        - mentoria_livre_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 10s
        timeout: 5s
        retries: 5

  volumes:
    mentoria_livre_data:
